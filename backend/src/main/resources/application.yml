server:
  port: ${PORT:8080}

spring:
  application:
    name: rongchengyishu-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/his?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:schema.sql
      data-locations: classpath:demo-data.sql
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com/chat/completions
  model: deepseek-chat
