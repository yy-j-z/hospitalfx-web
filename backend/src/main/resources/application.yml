server:
  port: ${PORT:8080}

spring:
  application:
    name: hospitalfx-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/his?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com/chat/completions
  model: deepseek-chat
